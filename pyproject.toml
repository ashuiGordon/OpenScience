[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openscience-agent"
version = "0.1.0"
description = "Evidence-first, reproducible research agent with provider-neutral adapters"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenScience contributors" }]
keywords = ["agent", "open-science", "provenance", "research", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
openscience = "openscience_agent.cli:main"

[project.urls]
Homepage = "https://github.com/ashuiGordon/OpenScience"
Issues = "https://github.com/ashuiGordon/OpenScience/issues"
Repository = "https://github.com/ashuiGordon/OpenScience"

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["openscience_agent*"]
namespaces = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-m", "not live"]
testpaths = ["tests"]
markers = [
  "live: opt-in tests that contact external providers",
]

[tool.coverage.run]
branch = true
source = ["openscience_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["openscience_agent"]
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
